name: Publish package

on:
    push:
        branches:
            - main
        paths:
            - package.json
            - .github/workflows/publish.yml
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

concurrency:
    group: npm-publish-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Check package version
              id: version
              shell: bash
              run: |
                  package_name=$(node -p "require('./package.json').name")
                  package_version=$(node -p "require('./package.json').version")
                  if npm view "$package_name@$package_version" version --json >version.json 2>version-error.log; then
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                      echo "$package_name@$package_version is already published."
                  elif node -e "process.exit(require('./version.json').error?.code === 'E404' ? 0 : 1)"; then
                      echo "publish=true" >> "$GITHUB_OUTPUT"
                  else
                      cat version-error.log
                      exit 1
                  fi

            - name: Install dependencies
              if: steps.version.outputs.publish == 'true'
              run: npm ci

            - name: Build package
              if: steps.version.outputs.publish == 'true'
              run: npm run build

            - name: Publish package
              if: steps.version.outputs.publish == 'true'
              run: npm publish --access public
